<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family:'Fraunces'; src:url('assets/fraunces-var.woff2') format('woff2-variations');
                   font-weight:100 900; font-display:block; }
      @font-face { font-family:'Archivo'; src:url('assets/archivo-var.woff2') format('woff2-variations');
                   font-weight:100 900; font-display:block; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
      #pay { width:100%; height:100%; position:relative;
             font-family:'Archivo', system-ui, sans-serif; color:#17150f; }

      #cap {
        position:absolute; left:0; right:0; top:120px; text-align:center;
        font-family:'Fraunces'; font-weight:600;
        font-size:104px; letter-spacing:-2px; line-height:1.02;
      }
      #cap em { font-style:normal; color:#4b3bd0; }

      /* The drill-down panel itself, not the table it produces. chain-builder
         .png is a bare 460-wide popup captured at 2x, so 920x1852; shown at
         874 wide that is a 0.95 scale. Framed on the step-3 region -- crop
         y=410 h=960 in source, so -389.5 and 912 once scaled -- which holds
         "10 levels / Link", all ten rungs and the cost note in one shot. */
      #shot {
        position:absolute; left:103px; top:486px; width:874px; height:912px;
        overflow:hidden; border-radius:22px;
        box-shadow:0 50px 100px -30px rgba(23,21,15,.4);
      }
      #shot img { position:absolute; width:874px; height:1759px; left:0; top:-390px; }

      #end {
        position:absolute; inset:0; background:#faf8f4;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
      }
      .mark { width:148px; height:148px; border-radius:34px; background:#4b3bd0;
              display:flex; align-items:center; justify-content:center; margin-bottom:44px; }
      .wordmark { font-family:'Fraunces'; font-weight:600; font-size:92px; letter-spacing:-1.5px; }
      .claims { display:flex; gap:16px; margin-top:50px; }
      .claims span { font-size:32px; color:#5d574a; background:#fffefb;
                     border:1px solid #e0dbd0; border-radius:999px; padding:16px 30px; }
      .url { font-family:ui-monospace, monospace; font-size:36px; margin-top:56px; }
    </style>
  </head>
  <body>
    <div id="pay" data-composition-id="payoff" data-start="0" data-duration="6.548"
         data-width="1080" data-height="1920">

      <div id="cap" class="clip" data-start="0" data-duration="4" data-track-index="0">
        One setup.<br /><em>Every row.</em>
      </div>
      <div id="shot" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <img src="assets/chain-builder.png" alt="" />
      </div>

      <div id="end" class="clip" data-start="3.82" data-duration="2.728" data-track-index="2">
        <div class="mark">
          <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="#faf8f4"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20 L14 10" /><path d="M18 3 v5 M15.5 5.5 h5" />
          </svg>
        </div>
        <div class="wordmark">Magic Scraper</div>
        <div class="claims"><span>Ten levels</span><span>No server</span><span>No account</span></div>
        <div class="url">magicscraper.app/demo</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('#cap', { opacity: 0, y: 40, scale: 1.06 },
        { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: 'power4.out' }, 0);
      tl.fromTo('#shot', { opacity: 0, y: 260, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: 'power3.out' }, 0.08);
      tl.to('#shot', { scale: 1.018, duration: 3.0, ease: 'none' }, 0.78);

      tl.fromTo('#end', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, 3.82);
      tl.fromTo('#end .mark', { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, 3.87);
      tl.fromTo('#end .wordmark', { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 4.02);
      tl.fromTo('#end .claims span', { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: 'power2.out' }, 4.22);
      tl.fromTo('#end .url', { opacity: 0 }, { opacity: 1, duration: 0.45 }, 4.67);

      window.__timelines['payoff'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
