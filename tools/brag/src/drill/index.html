<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#faf8f4; }
      #root { width:100%; height:100%; position:relative; }
      .clip { position:absolute; inset:0; }
      .act { z-index:3; }
      #flash { background:#fffdf7; opacity:0; pointer-events:none; z-index:50; }

      /* The page being scraped, behind the argument about scraping it. A real
         capture of /demo/catalogue, stacked twice and pre-blurred so it can
         drift the whole cut without a costly runtime filter, and washed back
         to 22% over paper so it is texture rather than content. */
      #bg { overflow:hidden; z-index:0; background:#faf8f4; }
      #bg img { position:absolute; left:0; top:0; width:1080px; height:3000px; }

      /* Grain. 256px tile, overlay, barely there -- it stops large flat areas
         of paper from banding once the video is compressed. */
      /* A paper scrim over the page. The backdrop alone measured fine in a
         sparse crop and competed badly where the product cards actually are;
         this keeps the texture and takes back the legibility. */
      #scrim { z-index:1; background:rgba(250,248,244,.66); pointer-events:none; }

      #grain {
        z-index:2; pointer-events:none; opacity:.045;
        background-image:url('assets/grain.png'); background-repeat:repeat;
        mix-blend-mode:multiply;
      }
    </style>
  </head>
  <body>
    <!-- Same beat grid as the first cut: happy-beats-business-moves vol-1
         (120.19 BPM, CC BY 4.0, ende.app), trimmed from 3.02s so every beat
         falls on a clean 0.50s multiple of video time. The source's strong cue
         at 17.02s is t=14.0s here, which is where the product arrives.

         Three acts: the problem (0-6), the descent (6-14), the payoff (14-20.5).
         The descent is the argument -- ten real levels of the chain behind
         /demo/catalogue, indenting as they go, so the shape of the frame says
         "deep" before a word of it is read. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.735"
         data-width="1080" data-height="1920">

      <div id="bg" class="clip" data-start="0" data-duration="20.735" data-track-index="0">
        <img src="assets/backdrop.png" alt="" />
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="20.735" data-track-index="1"></div>
      <div id="grain" class="clip" data-start="0" data-duration="20.735" data-track-index="2"></div>

      <div id="act-setup" class="clip act" data-composition-id="setup"
           data-start="0" data-duration="6.548" data-track-index="0"
           data-composition-src="compositions/setup.html"></div>

      <div id="act-descent" class="clip act" data-composition-id="descent"
           data-start="6.548" data-duration="7.639" data-track-index="1"
           data-composition-src="compositions/descent.html"></div>

      <div id="act-payoff" class="clip act" data-composition-id="payoff"
           data-start="14.187" data-duration="6.548" data-track-index="2"
           data-composition-src="compositions/payoff.html"></div>

      <div id="flash" class="clip" data-start="0" data-duration="20.735" data-track-index="3"></div>

      <audio id="bed" src="assets/music-drill.mp3" data-start="0" data-duration="20.735"
             data-volume="0.62" data-track-index="4"></audio>

      <!-- A tick under each line, and one under each rung of the descent, so
           the ladder is heard as footsteps rather than seen as a list. -->
      <audio id="sfx-tick-01" src="assets/tick.wav" data-start="0.0" data-duration="0.06" data-volume="0.42" data-track-index="5"></audio>
      <audio id="sfx-tick-02" src="assets/tick.wav" data-start="1.091" data-duration="0.06" data-volume="0.42" data-track-index="6"></audio>
      <audio id="sfx-tick-03" src="assets/tick.wav" data-start="2.183" data-duration="0.06" data-volume="0.42" data-track-index="7"></audio>
      <audio id="sfx-tick-04" src="assets/tick.wav" data-start="3.274" data-duration="0.06" data-volume="0.42" data-track-index="8"></audio>
      <audio id="sfx-tick-05" src="assets/tick.wav" data-start="6.548" data-duration="0.06" data-volume="0.34" data-track-index="9"></audio>
      <audio id="sfx-tick-06" src="assets/tick.wav" data-start="7.094" data-duration="0.06" data-volume="0.34" data-track-index="10"></audio>
      <audio id="sfx-tick-07" src="assets/tick.wav" data-start="7.639" data-duration="0.06" data-volume="0.34" data-track-index="11"></audio>
      <audio id="sfx-tick-08" src="assets/tick.wav" data-start="8.185" data-duration="0.06" data-volume="0.34" data-track-index="12"></audio>
      <audio id="sfx-tick-09" src="assets/tick.wav" data-start="8.731" data-duration="0.06" data-volume="0.34" data-track-index="13"></audio>
      <audio id="sfx-tick-10" src="assets/tick.wav" data-start="9.276" data-duration="0.06" data-volume="0.34" data-track-index="14"></audio>
      <audio id="sfx-tick-11" src="assets/tick.wav" data-start="9.822" data-duration="0.06" data-volume="0.34" data-track-index="15"></audio>
      <audio id="sfx-tick-12" src="assets/tick.wav" data-start="10.368" data-duration="0.06" data-volume="0.34" data-track-index="16"></audio>
      <audio id="sfx-tick-13" src="assets/tick.wav" data-start="10.913" data-duration="0.06" data-volume="0.34" data-track-index="17"></audio>
      <audio id="sfx-tick-14" src="assets/tick.wav" data-start="11.459" data-duration="0.06" data-volume="0.34" data-track-index="18"></audio>
      <audio id="sfx-thud"  src="assets/thud.wav"  data-start="4.365" data-duration="0.45" data-volume="0.6"  data-track-index="19"></audio>
      <audio id="sfx-riser" src="assets/riser.wav" data-start="13.287" data-duration="0.9"  data-volume="0.55" data-track-index="20"></audio>
      <audio id="sfx-land"  src="assets/land.wav"  data-start="14.187" data-duration="0.5"  data-volume="0.8"  data-track-index="21"></audio>
      <audio id="sfx-chime" src="assets/chime.wav" data-start="18.057" data-duration="1.2" data-volume="0.5"  data-track-index="22"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const root = gsap.timeline({ paused: true });

      // One slow crawl down the page for the whole cut -- 1080px over 20.7s,
      // about 52px a second. Linear on purpose: an eased drift draws the eye,
      // and this must never be the thing being looked at.
      root.fromTo('#bg img', { y: 0 }, { y: -1080, duration: 20.735, ease: 'none' }, 0);
      // Grain is deliberately STATIC. Drifting it looked marginally better and
      // cost 26 Mbps: noise that changes every frame defeats inter-frame
      // prediction outright, and the same cut went from 4.7MB to 68MB. Held
      // still it is nearly free, because every frame predicts it perfectly.
      [14.187, 18.007].forEach(function (at) {
        root.to('#flash', { opacity: 0.85, duration: 0.07, ease: 'power2.out' }, at - 0.07);
        root.to('#flash', { opacity: 0, duration: 0.34, ease: 'power2.in' }, at);
      });
      window.__timelines['main'] = root;
      root.seek(0);
    </script>
  </body>
</html>
