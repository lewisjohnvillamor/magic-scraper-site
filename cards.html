<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;src:url('http://127.0.0.1:8899/assets/fonts/fraunces-var.woff2')format('woff2');font-weight:100 900}
@font-face{font-family:Archivo;src:url('http://127.0.0.1:8899/assets/fonts/archivo-var.woff2')format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}body{background:#0000}
.promo{width:300px;height:188px;background:#17150f;color:#faf8f4;
  display:flex;flex-direction:column;justify-content:center;gap:9px;padding:0 20px;position:relative;overflow:hidden}
.promo::after{content:'';position:absolute;right:-54px;top:-54px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,106,240,.42),rgba(124,106,240,0) 68%)}
.row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.glyph{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#7c6af0,#4a3bc0)}
.name{font-family:Fraunces;font-weight:700;font-size:27px;letter-spacing:-.7px;line-height:1}
.tag{font-family:Archivo;font-weight:600;font-size:14.5px;line-height:1.3;color:#d9d2c4;position:relative;z-index:1}
.tag i{color:#e8853c;font-style:normal;font-variation-settings:'wght' 700}
.free{font-family:Archivo;font-weight:700;font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:#17150f;background:#e8a23c;padding:4px 9px;border-radius:5px;align-self:flex-start;position:relative;z-index:1}
</style></head><body>
<div id="promo" class="promo">
  <div class="row">
    <span class="glyph"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20 L14 10"/><path d="M18 3 v5 M15.5 5.5 h5"/></svg></span>
    <span class="name">Magic Scraper</span>
  </div>
  <p class="tag">Any web table or list <i>&rarr;</i> CSV, Excel or JSON. One click.</p>
  <span class="free">Free</span>
</div>
</body></html>
