# Cloudflare Workers: static assets, plus one small API.
#
# This was assets-only for a long time and the comment here said so. What
# changed is the roadmap's vote counter -- see src/index.js. Everything that is
# not /api/roadmap is still served straight from the assets binding, so the site
# behaves exactly as it did.
name = "magic-scraper-site"
main = "src/index.js"
compatibility_date = "2026-09-11"

[assets]
directory = "."
# The Worker needs to hand everything else back to the static assets, which
# requires the binding to be named.
binding = "ASSETS"
# Serve the branded 404 instead of Cloudflare's bare one. Without this a
# mistyped URL is a dead end with no way back to the site.
not_found_handling = "404-page"
# The Worker sees page requests too, not only /api/, so it can answer an AI
# agent that asks for a page as Markdown (src/markdown.js). Everything else
# passes straight through to the assets, with _headers applied as before.
# Images and fonts under /assets/ skip the Worker entirely.
run_worker_first = ["/*", "!/assets/*"]

# ---------------------------------------------------------------------------
# The API (src/index.js): the feature request board at /requests, the home
# page's "I'd use this" votes, and the goodbye page's question. All three use
# one D1 database. Until it is bound, /api/* answers 503 and every page falls
# back to an email link, so the site is never broken by this being missing.
#
# SETUP, once:
#   1. Cloudflare dashboard > Storage & Databases > D1 > Create database,
#      named magic-scraper. Copy its Database ID.
#   2. The block below, with that ID. (It is not a secret.)
#   3. Workers & Pages > magic-scraper-site > Settings > Variables and Secrets
#      > Add > type Secret, name ADMIN_TOKEN, value: a long random password of
#      your own. That unlocks /admin-requests. Never commit it here.
# The tables create themselves on the first request; there is no migration.
#

[[d1_databases]]
binding = "DB"
database_name = "magic-scraper"
database_id = "11f35cd1-3b94-4842-bf6c-7d99a74daa75"

# Writes to the API (new requests, votes, notify-me addresses, goodbye answers)
# are limited per visitor by Cloudflare's rate limiter: 20 a minute, which no
# person clicking through the board reaches. The visitor id the pages send is
# made up by the browser, so it cannot do this. The limiter counts by the
# connecting address in memory for the period; the Worker never sees a stored
# address and keeps none. Without this block the Worker still runs, with only
# the per-table ceilings in src/index.js.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
